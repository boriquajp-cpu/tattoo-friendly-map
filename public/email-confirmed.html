<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>メール確認完了 | Tattour</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-soft: #334155;
    --muted: #64748b;
    --edge: #e7ebf0;
    --bg: #ffffff;
    --accent: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans TC", sans-serif;
    line-height: 1.75;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #dcfce7;
    color: #166534;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: var(--edge);
    margin: 28px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="check">✓</div>
    <h1>メールアドレスの確認が完了しました</h1>
    <p>Tattourアプリに戻って、ログインしてください。</p>

    <div class="divider"></div>

    <h1 lang="zh-Hant">電子郵件驗證完成</h1>
    <p lang="zh-Hant">請返回 Tattour App 並登入。</p>
  </div>
</body>
</html>
