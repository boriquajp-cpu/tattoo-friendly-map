<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>メール確認完了 | Tattour</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-soft: #334155;
    --muted: #64748b;
    --edge: #e7ebf0;
    --bg: #ffffff;
    --accent: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans TC", sans-serif;
    line-height: 1.75;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #dcfce7;
    color: #166534;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: var(--edge);
    margin: 28px 0;
  }
  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="check">✓</div>
    <h1>メールアドレスの確認が完了しました</h1>
    <p>下のボタンからTattourアプリに戻ってください。</p>
    <a class="btn" id="return-btn" href="#">アプリに戻る</a>

    <div class="divider"></div>

    <h1 lang="zh-Hant">電子郵件驗證完成</h1>
    <p lang="zh-Hant">請點擊下方按鈕返回 Tattour App。</p>
    <a class="btn" id="return-btn-zh" href="#">返回 App</a>
  </div>
  <script>
    (function () {
      var code = new URLSearchParams(location.search).get('code');
      var deepLink = 'com.tattoomapjapan.app://login-callback' + (code ? ('?code=' + encodeURIComponent(code)) : '');
      ['return-btn', 'return-btn-zh'].forEach(function (id) {
        document.getElementById(id).href = deepLink;
      });
      // ボタンを押さなくても済むよう、ページ表示と同時に一度だけ自動で戻ることも試みる
      // （タップ操作を要求するブラウザでは失敗するだけで、ボタンが確実なフォールバックになる）
      if (code) {
        window.location.href = deepLink;
      }
    })();
  </script>
</body>
</html>
